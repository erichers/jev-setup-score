<figure class="flow-figure" appReveal [revealSelf]="false">
  <svg class="flow" viewBox="0 0 480 540" width="480" height="540" role="img">
    <title>Daily bars through day t become thirteen features, then a logistic probability, then a score from 0 to 100. A test window follows the train window.</title>
    <g class="flow-node" style="--step: 0">
      <rect class="flow-box" x="40" y="8" width="400" height="58"></rect>
      <text class="flow-label" x="56" y="32">Daily bars</text>
      <text class="flow-sub" x="56" y="52">Closes through day t</text>
    </g>
    <path class="draw" pathLength="1" style="--step: 1" d="M240 66 V100"></path>
    <g class="flow-node" style="--step: 2">
      <rect class="flow-box" x="40" y="100" width="400" height="58"></rect>
      <text class="flow-label" x="56" y="124">Thirteen features</text>
      <text class="flow-sub" x="56" y="144">Known on day t</text>
    </g>
    <path class="draw" pathLength="1" style="--step: 3" d="M240 158 V192"></path>
    <g class="flow-node" style="--step: 4">
      <rect class="flow-box" x="40" y="192" width="400" height="58"></rect>
      <text class="flow-label" x="56" y="216">Logistic regression</text>
      <text class="flow-sub" x="56" y="236">Weights turn features into P(up)</text>
    </g>
    <path class="draw flow-curve" pathLength="1" style="--step: 5" [attr.d]="curve()"></path>
    <circle class="flow-dot" style="--step: 6" cx="268" [attr.cy]="dotY()" r="4"></circle>
    <g class="flow-node" style="--step: 6">
      <rect class="flow-box" x="40" y="356" width="400" height="58"></rect>
      <text class="flow-label" x="56" y="380">Score</text>
      <text class="flow-sub" x="56" y="400">Round P(up) to a number from 0 to 100</text>
    </g>
    <g class="flow-node" style="--step: 7">
      <text class="flow-sub" x="40" y="452">Walk-forward</text>
      <rect class="flow-box" x="40" y="464" width="230" height="40"></rect>
      <text class="flow-label" x="56" y="490">Train 504</text>
      <text class="flow-sub" x="282" y="490">H</text>
      <rect class="flow-box" x="304" y="464" width="136" height="40"></rect>
      <text class="flow-label" x="320" y="490">Test 63</text>
    </g>
    <rect class="draw flow-window" pathLength="1" style="--step: 8" x="302" y="462" width="140" height="44"></rect>
  </svg>
  <ol class="flow-list" aria-label="How a score is made">
    <li><b>Daily bars</b><span>Closes through day t</span></li>
    <li><b>Thirteen features</b><span>Known on day t</span></li>
    <li><b>Logistic regression</b><span>Weights turn features into P(up)</span></li>
    <li><b>Score</b><span>Round P(up) to a number from 0 to 100</span></li>
    <li class="flow-wf"><b>Walk-forward</b><span class="wf-row"><span class="wf-box">Train 504</span><span class="wf-gap">H</span><span class="wf-box test">Test 63</span></span></li>
  </ol>
  <figcaption>Bars, the logistic step, and the score. The test window starts after the horizon.</figcaption>
</figure>
