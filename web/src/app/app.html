<a class="skip" href="#content">Skip to content</a>
<div class="app">
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" routerLink="/" aria-label="Jev Setup Score home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <path d="M7 17h4.6l1.8-4.4 2.7 8.4 2.1-4H25" fill="none" stroke="#19c39c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Jev</span>
          <span class="brand-sub">Setup Score</span>
        </span>
      </a>
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 14.5A6.5 6.5 0 0 1 9.5 5 6.5 6.5 0 1 0 16.5 14.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        }
      </button>
    </div>
  </header>
  <main id="content" class="wrap">
    <router-outlet />
  </main>
  <footer class="wrap site-footer">
    <p>Educational tool. Not financial advice.</p>
    <p>by Ulric studio</p>
  </footer>
</div>
